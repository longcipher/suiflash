[workspace]
members = [
    "suiflash-bot",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Bob Liu <akagi201@gmail.com>"]
repository = "https://github.com/longcipher/suiflash"
description = "SuiFlash workspace: suiflash-bot (Rust backend) + suiflash-contract (Move)"

[workspace.dependencies]
artemis = { git = "https://github.com/akjong/artemis" }
async-trait = "0.1.89"
axum = "0.8.6"
bcs = "0.1"
blake3 = "1"
clap = { version = "4.5.49", features = ["derive"] }
config = "0.15.18"
dotenv = "0.15"
eyre = "0.6"
hex = "0.4"
move-core-types = { git = "https://github.com/mystenlabs/sui", package = "move-core-types" }
reqwest = "0.12.24"
serde = "1.0.228"
serde_json = "1.0.145"
sui_json_rpc_types = { git = "https://github.com/mystenlabs/sui", package = "sui-json-rpc-types" }
sui_sdk = { git = "https://github.com/mystenlabs/sui", package = "sui-sdk" }
sui_types = { git = "https://github.com/mystenlabs/sui", package = "sui-types" }
tokio = "1.48.0"
toml = "0.9.8"
tracing = "0.1"
tracing-subscriber = "0.3.20"
bech32 = "0.11.0"

# Dev dependencies
tokio-test = "0.4"
